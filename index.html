<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon_io/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon_io/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="./assets/favicon_io/site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
  </head>
  <body>
    <fieldset>
      <i class="fa-solid fa-xmark"></i>
      <h1>~ Registration Form ~</h1>
      <form action="feedback.html" method="get">
        <input type="text" placeholder="Username" required >
        <input type="email" placeholder="Email Address" required >
        <input type="text" placeholder="Country" required>
        <input type="number" placeholder="Phone" required >
        <input type="password" placeholder="Password" id="password" required>
        <input type="checkbox" name="terms and conditions" required>
        <p id="terms">
          Lorem, ipsum dolor sit amet consectetur adipisicing elit. Esse alias
          nulla optio harum dolor quas quam voluptas tempora veniam. Illum
          necessitatibus eius, esse officiis id nobis ipsam consequatur nesciunt
          architecto?
        </p>
        <div align="center"><button type="submit"><b>CREATE ACCOUNT</b></button></div>
        <div align="center">
          <p>Already have an a <a href="">Sign In</a></p>
        </div>
      </form>
    </fieldset>
  </body>
</html>
