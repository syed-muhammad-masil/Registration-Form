<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon_io/android-chrome-512x512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon_io/favicon-16x16.png" />
    <link rel="manifest" href="./assets/favicon_io/site.webmanifest" />
  </head>
  <body>
    <fieldset>
      <h1>~ Registration Form ~</h1>
      <form method="post" action="ACCOUNT CREATED SUCCESFULLY">
        <input type="text" placeholder="Username" >
        <input type="email" placeholder="Email Address" >
        <input type="text" placeholder="Country">
        <input type="number" placeholder="Phone" >
        <input type="password" placeholder="Password">
        <input type="checkbox" name="terms and conditions">
        <p id="terms">
          Lorem, ipsum dolor sit amet consectetur adipisicing elit. Esse alias
          nulla optio harum dolor quas quam voluptas tempora veniam. Illum
          necessitatibus eius, esse officiis id nobis ipsam consequatur nesciunt
          architecto?
        </p>
        <div align="center"><button type="submit">CREATE ACCOUNT</button></div>
        <div align="center">
          <p>Already have an account? <a href="">Sign In</a></p>
        </div>
      </form>
    </fieldset>
  </body>
</html>
